services:
  mongodb:
    image: mongo:6-jammy
    container_name: beublog-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - beublog-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: beublog-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGODB_URI=mongodb://mongodb:27017/blogdb
      - JWT_SECRET=${JWT_SECRET:-beublog-gizli-anahtar-dev}
      - NODE_ENV=production
    volumes:
      - ./backend/uploads:/app/uploads
    depends_on:
      - mongodb
    networks:
      - beublog-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: beublog-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - beublog-network

volumes:
  mongodb_data:

networks:
  beublog-network:
    driver: bridge
